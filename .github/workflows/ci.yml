name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install the project
        run: uv sync --extra web --extra ml --extra dev

      # The suite never touches the network — see tests/conftest.py.
      - name: Run tests
        run: uv run pytest -q
