# futmarket configuration. All runtime knobs live here, not in code.

# What to learn from
source: futgg           # price series to build features from (fut.gg bulk feed)
platform: console       # console | pc

# Where data lives (relative to this file)
database_path: data/market.db
log_path: data/collector.log

# Trade economics the model labels against
tax_rate: 0.05          # EA transfer-market sell tax (5%)
target_pct: 25.0        # profit target for the triple-barrier labels
stop_pct: 8.0           # stop-loss for the triple-barrier labels
