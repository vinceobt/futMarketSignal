[project]
name = "futmarket"
version = "0.1.0"
description = "A self-improving ML system for EA FC Ultimate Team: learns how cards behave and recommends what to buy and sell. Never trades, never touches EA credentials."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vincent Obeta" }]
keywords = ["machine-learning", "time-series", "market-analysis", "ea-fc", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "patchright",
    "camoufox[geoip]",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
# Histogram gradient boosting via scikit-learn (same family as LightGBM, but
# needs no system OpenMP — sklearn bundles its own, so this installs clean on
# macOS without Homebrew). Models sit behind an interface if we ever swap.
ml = ["scikit-learn>=1.5", "joblib>=1.3", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/vinceobt/futMarketSignal"
Source = "https://github.com/vinceobt/futMarketSignal"

[project.scripts]
futmarket = "futmarket.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
